# Development Docker Compose
# Usage (after `make setup`, from the repository root):
#   docker compose --project-name "$(make print-project)" --project-directory . \
#     --env-file .env -f docker-compose.dev.yml up -d
#
# Publishes every service on this computer only (127.0.0.1), for debugging:
#   Frontend: http://localhost:3000  (Vite hot-reload)
#   Backend:  http://localhost:4000  (node --watch)
#   Database: localhost:5432
# A port published without an address is open on every network interface,
# and Docker's published ports bypass a host firewall such as UFW.
#
# For production, use: docker compose up -d --build  (uses docker-compose.yml)

services:
  database:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    restart: unless-stopped
    # Same read-only root as production so a crash-loop shows up locally.
    # Compose scopes this dev volume to the per-checkout project, separate from
    # production and from the pre-isolation dev project's volume.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-cozyvtt} -d ${DATABASE_NAME:-cozyvtt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DATABASE_APP_USER:-cozyvtt_app}:${DATABASE_APP_PASSWORD:-${DATABASE_PASSWORD}}@database:5432/${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_APP_USER: ${DATABASE_APP_USER:-cozyvtt_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-${DATABASE_PASSWORD}}
      DATABASE_NAME: ${DATABASE_NAME}
      # Development whatever .env says: .env.example sets production, for the
      # production stack, and in production mode the backend refuses the
      # example secrets, logs as JSON and hides error details.
      NODE_ENV: development
      PORT: 4000
      # Dev must use its own secret; the production SESSION_SECRET is ignored.
      SESSION_SECRET: ${DEV_SESSION_SECRET:-}
      SETUP_TOKEN: ${DEV_SETUP_TOKEN:-}
      # Same names as production: the development stack does not split a
      # DEV_ backup key the way it splits DEV_SESSION_SECRET. Empty: the
      # Instance still boots; Create Backup is refused so a plaintext archive
      # is not written. Never SESSION_SECRET.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_ENCRYPTION_PREVIOUS_KEYS: ${BACKUP_ENCRYPTION_PREVIOUS_KEYS:-}
      # Dev defaults to the Vite address. Set DEV_CORS_ORIGIN for a custom
      # host or port; production continues to use CORS_ORIGIN.
      CORS_ORIGIN: ${DEV_CORS_ORIGIN:-http://localhost:3000}
      APP_URL: ${DEV_APP_URL:-http://localhost:3000}
      # Bind application paths to the isolated mounts even if backend/.env
      # contains production or manual-install overrides.
      UPLOAD_DIR: /app/uploads
      BACKUP_DIR: /app/backups
      SMTP_HOST: ${DEV_SMTP_HOST:-}
      SMTP_PORT: ${DEV_SMTP_PORT:-}
      SMTP_USER: ${DEV_SMTP_USER:-}
      SMTP_PASS: ${DEV_SMTP_PASS:-}
      SMTP_FROM: ${DEV_SMTP_FROM:-}
      MAX_MAP_SIZE_MB: ${MAX_MAP_SIZE_MB}
      MAX_TOKEN_SIZE_MB: ${MAX_TOKEN_SIZE_MB}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB}
      MAX_AVATAR_SIZE_MB: ${MAX_AVATAR_SIZE_MB}
      MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB}
      # No bundled Nginx in dev — Vite proxies directly to the backend, so this
      # only affects the startup warning about proxy body caps.
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-}
      SMTP_SECURE: ${DEV_SMTP_SECURE:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      ASSET_UPLOAD_RATE_LIMIT: ${ASSET_UPLOAD_RATE_LIMIT:-30}
      CAMPAIGN_ARCHIVE_RATE_LIMIT: ${CAMPAIGN_ARCHIVE_RATE_LIMIT:-20}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-3600000}
      REMEMBER_ME_MAX_AGE: ${REMEMBER_ME_MAX_AGE:-2592000000}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      # Keep development logs out of the broad source bind mount.
      - /app/logs
      - ./backend/uploads-dev:/app/uploads
      # Instance backups (full database dumps) live beside uploads, never inside it.
      - ./backend/backups-dev:/app/backups
    command: npm run dev

  # `make setup` runs this profiled helper explicitly before the non-root
  # backend starts. It has no application environment or source-tree mount,
  # cannot reach a network, and can write only the two dev runtime directories.
  # Make passes the host device:inode identities as positional command args.
  backend-permissions:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - permissions
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    read_only: true
    user: root
    entrypoint: ["/usr/local/bin/permissions-check.sh"]
    # The checker rejects nested symlinks and skips entries on a different
    # device before chown; its host-side identity check still cannot prevent a
    # later concurrent path replacement.
    command: []
    volumes:
      - ./backend/uploads-dev:/app/uploads
      - ./backend/backups-dev:/app/backups

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # The page asks its own address, and Vite proxies /api and /socket.io to
      # the backend container, as nginx does in production.
      VITE_PROXY_TARGET: http://backend:4000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  postgres_data:
    driver: local
