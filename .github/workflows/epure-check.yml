name: "EPURE Contract Verification"
on:
  pull_request:
    branches: [dev, main, 'feature/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # read consumer workflow contract
jobs:
  verify-contract:
    name: "Verify EPURE Consumer Contract"
    uses: Giskard-AI/epure/.github/workflows/epure-check.yml@954b2357934a6dea0b026d9ce1bc1147f10046e0 # v1.6.1
    with:
      repository: ${{ github.repository }}
      pinned_ref: "Giskard-AI/epure/.github/workflows/epure-check.yml@954b2357934a6dea0b026d9ce1bc1147f10046e0 # v1.6.1"
      strict_sha_pinning: true
