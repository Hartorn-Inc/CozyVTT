name: "EPURE Contract Verification"
on:
  pull_request:
    branches: [dev, main, 'feature/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # read consumer workflow contract
jobs:
  verify-contract:
    name: "Verify EPURE Consumer Contract"
    uses: Giskard-AI/epure/.github/workflows/epure-check.yml@e3158c4f4da8af92634354353bd23d33f2f9d2f2 # v1.5.1
    with:
      repository: ${{ github.repository }}
      pinned_ref: "Giskard-AI/epure/.github/workflows/epure-check.yml@e3158c4f4da8af92634354353bd23d33f2f9d2f2 # v1.5.1"
      strict_sha_pinning: true
