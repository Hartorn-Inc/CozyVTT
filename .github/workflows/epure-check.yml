name: "EPURE Contract Verification"
on:
  pull_request:
    branches: [dev, main, 'feature/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # read consumer workflow contract
jobs:
  verify-contract:
    name: "Verify EPURE Consumer Contract"
    uses: Giskard-AI/epure/.github/workflows/epure-check.yml@be7b657e450fc96e0e4911ea129444af55be71e8 # v1.6.2
    with:
      repository: ${{ github.repository }}
      pinned_ref: "Giskard-AI/epure/.github/workflows/epure-check.yml@be7b657e450fc96e0e4911ea129444af55be71e8 # v1.6.2"
      strict_sha_pinning: true
