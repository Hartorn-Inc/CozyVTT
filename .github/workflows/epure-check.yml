name: "EPURE Contract Verification"
on:
  pull_request:
    branches: [dev, main, 'feature/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # read consumer workflow contract
jobs:
  verify-contract:
    name: "Verify EPURE Consumer Contract"
    uses: Giskard-AI/epure/.github/workflows/epure-check.yml@6b632d25e638e63b47c57f620a59771d2e3bd1bb # v1.5.6
    with:
      repository: ${{ github.repository }}
      pinned_ref: "Giskard-AI/epure/.github/workflows/epure-check.yml@6b632d25e638e63b47c57f620a59771d2e3bd1bb # v1.5.6"
      strict_sha_pinning: true
