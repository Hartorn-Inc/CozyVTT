name: "EPURE Contract Verification"
on:
  pull_request:
    branches: [dev, main, 'feature/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # read consumer workflow contract
jobs:
  verify-contract:
    name: "Verify EPURE Consumer Contract"
    uses: Giskard-AI/epure/.github/workflows/epure-check.yml@6f809933bdecd91304c5453b64510c2b709c98e1 # v1.5.0
    with:
      repository: ${{ github.repository }}
      pinned_ref: "Giskard-AI/epure/.github/workflows/epure-check.yml@6f809933bdecd91304c5453b64510c2b709c98e1 # v1.5.0"
      strict_sha_pinning: true
