# Continuous integration.
#
# This exists because of how the `any` problem happened. Strict typing was a
# project requirement, the rule that enforces it was switched off, and 326
# explicit `any` accumulated over months — because nothing ever ran the checks.
# Every gate was someone remembering to run it locally, and a rule nobody runs
# is not a rule.
#
# The same commands a developer runs, on every push to dev or main and on
# every pull request (including stacks whose base is not dev), plus what
# self-hosters run and a developer usually does not: the
# production images, the nginx configuration, a browser walking through the
# running stack, the migrations against the schema, and an advisory check of
# the dependencies. No deployment, no
# publishing, no secrets.
#
# Every action is pinned to a commit, with its version in a comment, so a tag
# moved upstream cannot change what runs here; Renovate (renovate.json)
# proposes new versions. Zizmor audits these workflows on the same triggers.
# The runner image is pinned the same way, to ubuntu-26.04: a move of
# ubuntu-latest to a new release should arrive as a change here.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read the code, nothing more: no job here writes to the repository.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # `npm test` is watch mode and would hang the runner. Coverage is
      # collected as a report, shown in the job summary, with no threshold yet.
      - run: npx vitest run --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary
      - name: Coverage summary
        run: python3 ../scripts/coverage-summary.py Frontend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      # The production build removes every console.log, info, debug and trace
      # call (vite.config.ts), since they print chat messages, secret rolls and
      # token details. Each of the first four lines below is printed only by
      # such a call, so finding one in the bundle means the stripping stopped
      # working. The last is a console.error line, which must stay.
      - name: Check that debug logging is stripped from the bundle
        run: |
          status=0
          for line in 'Received chat message' 'DM received secret roll audit' 'Tokens changed:' 'Picking up token'; do
            if grep -rqF "$line" dist/assets; then
              echo "::error::'$line' is in the built bundle: console.log calls are no longer removed"
              status=1
            fi
          done
          if ! grep -rqF 'Failed to load roll history' dist/assets; then
            echo "::error::'Failed to load roll history' is missing from the built bundle: console.error calls were removed too"
            status=1
          fi
          exit $status

  backend:
    name: Backend
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # The suite talks to a real PostgreSQL rather than a mock, so CI provides
    # one on the port the tests expect.
    services:
      postgres:
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: cozyvtt
          POSTGRES_PASSWORD: cozyvtt
          POSTGRES_DB: cozyvtt_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cozyvtt:cozyvtt@localhost:55433/cozyvtt_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The generated Prisma client is not committed, and typecheck depends on
      # it — without this, every column added since the last generate is a
      # compile error.
      - run: npx prisma generate
      # schema.prisma and the migrations must describe the same database. A
      # schema change with no migration passes the suite when nothing queries
      # what changed, and then never reaches an upgraded instance. Prisma
      # applies the migrations to an empty database of its own (the shadow)
      # and compares the result with the schema; --exit-code fails on any
      # difference. prisma.config.ts reads the shadow's address from
      # SHADOW_DATABASE_URL.
      - name: Compare schema.prisma with the migrations
        env:
          SHADOW_DATABASE_URL: postgresql://cozyvtt:cozyvtt@localhost:55433/cozyvtt_shadow
        run: |
          PGPASSWORD=cozyvtt psql -h localhost -p 55433 -U cozyvtt -d cozyvtt_test -c 'CREATE DATABASE cozyvtt_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npx prisma migrate deploy
      # Throwaway database on this job's PostgreSQL 18: create the schema owner
      # with password auth, reassign a bootstrap-owned function and enum, then
      # migrate and apply the login-session revocation SQL as DATABASE_APP_USER.
      - name: Schema-owner helper against PostgreSQL 18
        working-directory: ${{ github.workspace }}
        run: python3 -m unittest discover -s scripts/tests -p test_schema_owner.py -v
      - run: npx tsc --noEmit
      - run: npm run lint
      # Coverage is collected as a report, shown in the job summary, with no
      # threshold yet.
      - run: npx jest --coverage --coverageReporters=text-summary --coverageReporters=json-summary
      - name: Coverage summary
        run: python3 ../scripts/coverage-summary.py Backend coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Docs
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The route check also loads the OpenAPI file as YAML, which needs PyYAML.
      - run: pip install pyyaml
      - run: python3 scripts/spec-coverage.py
      - run: python3 scripts/websocket-events.py --check
      # The scripts' own tests: every form of route and event the doc checks
      # read, and what the nginx check, the coverage summary and the
      # conventional-commit title check read.
      - run: python3 -m unittest discover -s scripts/tests

  # Known advisories, from both lockfiles. A high or critical advisory in the
  # packages an instance runs (--omit=dev) fails the job. The developer
  # tools, which never reach an instance, are listed after it and fail
  # nothing: their advisories wait for the tools' next major versions. Each
  # audit runs whatever the ones before it found, so every result is shown.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
      - name: Backend, what an instance runs
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Frontend, what an instance runs
        if: always()
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Both projects with their developer tools (report only)
        if: always()
        continue-on-error: true
        run: |
          status=0
          for project in backend frontend; do
            echo "::group::$project"
            (cd "$project" && npm audit --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit $status

  # What an Operator's `docker compose up -d --build` runs: the compose file
  # read, the pinned nginx image pulled, the database and both application
  # images built, High and Critical advisories in those four runtime images, and the
  # bundled nginx's configuration rendered as its container renders it and
  # checked by nginx, the HTTPS example from docs/DEPLOYMENT.md included.
  # Then the stack is started and a browser walks through it (frontend/e2e):
  # the setup wizard, signing in and out, a campaign opened with its live
  # connection, at desktop and phone sizes.
  images:
    name: Production images, nginx and smoke tests
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read docker-compose.yml with the example settings
        run: cp .env.example .env && docker compose config -q
      - name: Pull the pinned nginx image
        run: docker compose pull nginx
      - run: docker compose build
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: false
      - name: Scan runtime images for High and Critical advisories
        run: python3 scripts/ci/image-advisories.py
      - run: pip install pyyaml
      - run: python3 scripts/nginx-check.py
      # Throwaway secrets, a port of its own, and a setup token the smoke
      # tests know; every other setting keeps its default.
      - name: Start the production stack
        run: |
          {
            echo "DATABASE_PASSWORD=$(openssl rand -hex 16)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "SETUP_TOKEN=ci-smoke-setup-token-0123456789"
            echo "HTTP_PORT=8080"
            echo "HTTPS_PORT=8443"
            echo "CORS_ORIGIN=http://localhost:8080"
          } > .env
          docker compose up -d --wait --wait-timeout 180
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the smoke tests and their browser
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Smoke tests in a browser
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_SETUP_TOKEN: ci-smoke-setup-token-0123456789
          E2E_PRODUCTION: '1'
        run: npx playwright test
      - name: The stack's logs, when something failed
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout the workflows zizmor audits
      actions: read # zizmor reads action metadata for online audits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          advanced-security: false
