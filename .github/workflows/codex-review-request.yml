# No-secret Codex review request.
#
# A collaborator adding the `codex-review` label runs this `pull_request`
# workflow. It has no Environment and no OpenRouter key: same-repo PR YAML
# cannot steal `OPENROUTER_API_KEY`. A successful run is the only label path
# that starts the secret-bearing workflow, which lives on `dev` and listens
# via `workflow_run`.
#
# `/review` does not go through this file; that comment is handled on `dev`.
name: Codex review request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    name: Request Codex review
    if: contains(github.event.pull_request.labels.*.name, 'codex-review')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Codex review requested
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "Codex review requested for PR $PR_NUMBER"
