# Advisory pull request review (secret-bearing).
#
# This workflow's YAML is only trusted from the default branch (`dev`).
# It must not use pull_request or pull_request_target: same-repo PR YAML
# that names Environment `advisory-review` could steal `CURSOR_API_KEY`.
#
# Triggers that run this file from `dev`:
#   - `issue_comment` `/review` (OWNER/MEMBER/COLLABORATOR; silent skip else)
#   - `workflow_dispatch` only when `github.ref` is the default branch
#   - `workflow_run` of "Advisory review request" after that no-secret
#     pull-request job succeeds (the `advisory-review` label path)
#
# Restrict Environment `advisory-review` to branch `dev` only (a human GitHub
# setting). Do not add `refs/pull/*/merge`. `workflow_dispatch` off `dev`
# must not reach the Environment.
#
# Secret-bearing jobs load Python, prompts, and reviewer roles from `dev`
# into `.trusted-automation`. The pull request tree is review evidence in
# `review-tree` only. Until this workflow exists on `dev`, a `/review` of
# the bootstrap PR itself will fail to find those trusted scripts; that is
# acceptable.
#
# The job posts one COMMENT review. It is not a required check, it does not
# approve, and it does not request changes.
#
# Every action is pinned to a commit, with its version in a comment.
# Untrusted strings arrive through env so they are never interpolated into
# the shell. No PAT, no GitHub App, no Azure, no Instance secrets.
name: Advisory PR review

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] /review is gated to OWNER/MEMBER/COLLABORATOR
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
  workflow_run: # zizmor: ignore[dangerous-triggers] no-secret request on pull_request; this file runs from dev
    workflows: ["Advisory review request"]
    types: [completed]

permissions: {}

env:
  # renovate: datasource=custom.cursor-cli depName=cursor-cli versioning=loose
  CURSOR_CLI_VERSION: "2026.10.19-6bbf2c4"
  # Digest lines must be refreshed when CURSOR_CLI_VERSION changes
  # (see scripts/ci/refresh-cursor-cli-digest.sh).
  CURSOR_CLI_INSTALL_SHA256: "cf80cc18d8b33bf33e762353977ca1868cfc45290c92c0ffdcef83bb8b37b44f"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id || github.run_id }}
  # A PR comment creates an issue_comment workflow before resolve can decide
  # whether the comment is an actual review command. Do not let those
  # comment-triggered runs cancel an in-flight review for the same PR.
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  resolve:
    name: Resolve pull request
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.body == '/review' &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request'
        )
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # Trusted helper from the default branch.
      issues: read # Read trusted /review issue comments.
      pull-requests: read # Resolve PR metadata for comment, dispatch, and workflow_run.
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      - name: Checkout trusted automation from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-automation
          persist-credentials: false

      - name: Resolve pull request
        id: resolve
        env:
          ADVISORY_REVIEW_COMMENT_COMMANDS: /review
          ADVISORY_REVIEW_REQUIRE_SAME_REPO: "true"
          GH_TOKEN: ${{ github.token }}
        run: python3 .trusted-automation/scripts/ci/advisory_pr_review.py resolve --output "$GITHUB_OUTPUT"

  review-context:
    name: Collect review context
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Trusted helper from the default branch.
      issues: read # Include human PR comments in review-only context.
      pull-requests: read # Read changed files, patches, and review comments.
    outputs:
      has_reviewers: ${{ steps.select.outputs.has_reviewers }}
      reviewer_matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout trusted automation from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-automation
          persist-credentials: false

      - name: Collect PR review context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: >-
          python3 .trusted-automation/scripts/ci/advisory_pr_review.py collect-review
          --pr-number "$PR_NUMBER"
          --output assessment/review-context.json

      - name: Select reviewer passes
        id: select
        run: >-
          python3 .trusted-automation/scripts/ci/advisory_pr_review.py select
          --context assessment/review-context.json
          --output assessment/reviewers.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload review context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: advisory-review-context
          path: assessment/
          if-no-files-found: error

  reviewer:
    name: Advisory reviewer (${{ matrix.name }})
    needs:
      - resolve
      - review-context
    if: needs.review-context.outputs.has_reviewers == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: advisory-review
      deployment: false
    permissions:
      contents: read # PR tree as evidence in review-tree; prompts and helper from the default branch.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.review-context.outputs.reviewer_matrix) }}
    steps:
      - name: Drop planted trusted paths
        run: |
          set -euo pipefail
          for path in .trusted-automation assessment review-tree; do
            if [ -L "$path" ]; then
              rm -f "$path"
            elif [ -e "$path" ]; then
              rm -rf "$path"
            fi
          done

      - name: Checkout trusted automation from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-automation
          persist-credentials: false

      - name: Checkout the pull request (review evidence)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: review-tree
          persist-credentials: false

      - name: Download review context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: advisory-review-context
          path: assessment

      - name: Prepare reviewer prompt
        env:
          REVIEWER_PROMPT_FILE: ${{ matrix.prompt_file }}
          REVIEWER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          case "$REVIEWER_NAME" in
            *-reviewer) ;;
            *) echo "unexpected reviewer" >&2; exit 1 ;;
          esac
          case "$REVIEWER_PROMPT_FILE" in
            .cursor/agents/*-reviewer.md) ;;
            *) echo "unexpected prompt file" >&2; exit 1 ;;
          esac
          mkdir -p assessment
          cp ".trusted-automation/$REVIEWER_PROMPT_FILE" assessment/reviewer-instructions.md
          {
            cat .trusted-automation/.github/advisory-review/prompts/pr-reviewer.md
            echo
            echo "Reviewer name: ${REVIEWER_NAME}"
            echo
            echo "Output JSON schema:"
            echo '```json'
            cat .trusted-automation/.github/advisory-review/schemas/reviewer-output.schema.json
            echo '```'
          } > assessment/reviewer-task.md
          if [ -L review-tree/assessment ]; then
            rm -f review-tree/assessment
          fi
          rm -rf review-tree/assessment
          mkdir -p review-tree/assessment
          cp assessment/review-context.json assessment/reviewer-instructions.md review-tree/assessment/

      - name: Install pinned Cursor CLI
        env:
          CURSOR_CLI_VERSION: ${{ env.CURSOR_CLI_VERSION }}
          CURSOR_CLI_INSTALL_SHA256: ${{ env.CURSOR_CLI_INSTALL_SHA256 }}
        run: |
          set -euo pipefail
          url="https://downloads.cursor.com/lab/${CURSOR_CLI_VERSION}/linux/x64/agent-cli-package.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL "$url" -o /tmp/cursor-agent-cli.tgz
          echo "${CURSOR_CLI_INSTALL_SHA256}  /tmp/cursor-agent-cli.tgz" | sha256sum -c -
          sudo mkdir -p /opt/cursor-cli
          sudo tar --strip-components=1 -xzf /tmp/cursor-agent-cli.tgz -C /opt/cursor-cli
          sudo chmod -R a+rX /opt/cursor-cli
          sudo chmod a+x /opt/cursor-cli/cursor-agent
          reported="$(/opt/cursor-cli/cursor-agent --version | tr -d '[:space:]')"
          echo "Cursor CLI reported version: ${reported}"
          echo "${reported}" | grep -F "${CURSOR_CLI_VERSION}"

      - name: Create unprivileged advisory review user
        run: |
          set -euo pipefail
          # drop-sudo is not used: ubuntu-26.04 drop-sudo cannot always ACL
          # /run/dbus/system_bus_socket (setfacl fails; chmod fallback never
          # runs). An unprivileged UNIX user is the key-protection alternative.
          if ! getent passwd advisoryreview >/dev/null; then
            sudo useradd --system --create-home advisoryreview
          fi
          # actions/checkout trees are 0700. The unprivileged user must read
          # trusted automation, the PR tree, and assessment inputs.
          chmod -R a+rX .trusted-automation review-tree assessment
          # GitHub-hosted /home/runner is 750. Grant execute on parents so
          # advisoryreview can reach GITHUB_WORKSPACE without joining sudo.
          path="$GITHUB_WORKSPACE"
          while [ "$path" != "/" ]; do
            sudo chmod a+x "$path"
            path="$(dirname "$path")"
          done
          sudo chown -R advisoryreview:runner assessment review-tree/assessment
          sudo chmod -R ug+rwX assessment review-tree/assessment

      - name: Run Cursor reviewer
        id: cursor
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REVIEWER_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          sudo -u advisoryreview \
            env HOME=/home/advisoryreview CI=true \
            PATH="/opt/cursor-cli:/usr/bin:/bin" \
            CURSOR_API_KEY="$CURSOR_API_KEY" \
            /opt/cursor-cli/cursor-agent \
            -p "$(cat assessment/reviewer-task.md)" \
            --mode=ask \
            --trust \
            --sandbox enabled \
            --workspace "${GITHUB_WORKSPACE}/review-tree" \
            --model grok-4.7 \
            --output-format text \
            > "assessment/reviewer-output-${REVIEWER_NAME}.json"

      - name: Create reviewer failure placeholder
        if: steps.cursor.outcome != 'success'
        env:
          REVIEWER_NAME: ${{ matrix.name }}
        run: >-
          python3 .trusted-automation/scripts/ci/advisory_pr_review.py placeholder
          --name "$REVIEWER_NAME"
          --output "assessment/reviewer-output-${REVIEWER_NAME}.json"

      - name: Upload reviewer output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: advisory-reviewer-output-${{ matrix.name }}
          path: assessment/reviewer-output-${{ matrix.name }}.json
          if-no-files-found: ignore

  post-review:
    name: Post advisory review
    needs:
      - resolve
      - review-context
      - reviewer
    if: always() && needs.resolve.outputs.should_run == 'true' && needs.review-context.result == 'success' && needs.review-context.outputs.has_reviewers == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Trusted helper from the default branch.
      pull-requests: write # Post the advisory COMMENT review.
    steps:
      - name: Checkout trusted automation from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-automation
          persist-credentials: false

      - name: Prepare reviewer output directory
        run: mkdir -p assessment/reviewer-outputs

      - name: Download reviewer outputs
        if: needs.review-context.outputs.has_reviewers == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: advisory-reviewer-output-*
          path: assessment/reviewer-outputs
          merge-multiple: true

      - name: Assemble advisory markdown
        run: >-
          python3 .trusted-automation/scripts/ci/advisory_pr_review.py assemble-review
          --outputs-dir assessment/reviewer-outputs
          --output assessment/final-review.md

      - name: Post advisory GitHub review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: >-
          python3 .trusted-automation/scripts/ci/advisory_pr_review.py post-review
          --pr-number "$PR_NUMBER"
          --body-file assessment/final-review.md
