# Refresh CURSOR_CLI_INSTALL_SHA256 after Renovate bumps CURSOR_CLI_VERSION.
# Same-repo pull requests labeled deps:cursor-cli only. No pull_request_target.
name: Cursor CLI digest refresh

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh Cursor CLI digest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(github.event.pull_request.labels.*.name, 'deps:cursor-cli')
        )
      }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # Commit the digest on the same-repo PR branch.
      pull-requests: write # Drop the deps:cursor-cli label after the run.
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: true

      - name: Refresh SHA256 digest
        run: bash scripts/ci/refresh-cursor-cli-digest.sh

      - name: Commit digest if it changed
        env:
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/advisory-pr-review.yml; then
            echo "No digest drift"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/advisory-pr-review.yml
          git commit -m "chore(deps): refresh Cursor CLI tarball digest"
          git push origin "HEAD:${BRANCH}"

      - name: Remove deps:cursor-cli label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER}" ]; then
            exit 0
          fi
          gh api -X DELETE "repos/${REPO}/issues/${PR_NUMBER}/labels/deps:cursor-cli" >/dev/null || true
